name: Validación Flutter manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolver dependencias fijadas
        run: flutter pub get --enforce-lockfile
      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analizar código
        run: flutter analyze
      - name: Ejecutar pruebas de widgets
        run: |
          mkdir -p test-results
          flutter test --machine | tee test-results/flutter-tests.jsonl
      - name: Conservar resultados reales de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futschool-test-results
          path: app/test-results/flutter-tests.jsonl
          if-no-files-found: ignore
          retention-days: 14
      - name: Compilar Android debug
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: futschool-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
